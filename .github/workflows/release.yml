name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build portable game
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\packaging\build_windows.ps1

      - name: Smoke-test bundled assets
        shell: pwsh
        run: |
          $game = Resolve-Path '.\dist\Sunny Grove\Sunny Grove.exe'
          if (-not (Test-Path (Join-Path $game.Directory 'assets\tiles\grass.png'))) {
            throw 'Bundled grass tile was not found.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $projectVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          $tagVersion = '${{ github.ref_name }}'.Substring(1)
          $expectedTagVersion = $projectVersion -replace 'rc(\d+)$', '-rc.$1'
          if ($tagVersion -ne $expectedTagVersion) {
            throw "Release tag must be v$expectedTagVersion."
          }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$tagVersion" packaging\sunny-grove.iss

      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.Substring(1)
          Compress-Archive -Path '.\dist\Sunny Grove\*' -DestinationPath ".\dist-installer\Sunny-Grove-$tagVersion-portable.zip"
          Get-FileHash .\dist-installer\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *$($_.Path | Split-Path -Leaf)" } | Set-Content .\dist-installer\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            This Windows release is unsigned. Windows SmartScreen may ask for confirmation before installation.
          files: |
            dist-installer/*.exe
            dist-installer/*.zip
            dist-installer/SHA256SUMS.txt